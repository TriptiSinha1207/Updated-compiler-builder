[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-signal"
version = "0.1.0"
description = "AI Signal backend service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "flask>=2.3.0",
  "pydantic>=2.8.0",
  "gunicorn>=20.1.0"
]

[tool.setuptools]
packages = ["pipeline"]

[tool.setuptools.package-data]
pipeline = ["*.json"]
